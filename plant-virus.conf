# ===================================================
# Plant Virus: 4-in-1 Database Server
# ===================================================
limit_req_zone $binary_remote_addr zone=pvdb_submit:10m rate=12r/m;
# 2026-10-12: LLM endpoints (/knowledge/query, /api/chat) rate limit
limit_req_zone $binary_remote_addr zone=pvdb_llm:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10M;
    # ---- 2026-10-16: JSON/JS/CSS 文本 gzip（全局检索索引 /data/global_search_index.json ~6MB 传输侧减到 ~1/6）----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 10240;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_vary on;
    # ---- 1. Plant Virus Reference Database (Static) ----
    # 2026-09-30: 显式请求 /reference/index.html 会经 alias 命中 docs/index.html（平台首页），
    # 属全站镜像的被动暴露（全站无任何页面引用它）→ 301 回参考库入口。
    # 注：`=` 精确匹配优先级最高，与声明位置无关。
    location = /reference/index.html { return 301 /reference/; }
    location /reference/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/;
        index reference_index.html;
        index index.html;
    }
    location /reference/data/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/data/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # ---- TE & EVE Database (RETIRED 2026-09-23 -> /eve/) ----
    # TE（转座子）与植物病毒无关，与 /eve/ 也不是同一分析 —— 整个 /te/ 下线，
    # docs/te/ 已移出服务目录（改放 archive/_pending_delete_20260923/）。
    # 保留 301 而非 404：旧外链与书签仍能落到 /eve/。
    # 注：/te/ 必须同时声明 `=` 与 `/te/` 两条 —— 前缀块不匹配裸 /te，
    #     否则裸 /te 会落到 `location /` 兜底变成 404。
    location = /te { return 301 /eve/; }
    location /te/ { return 301 /eve/; }

    # ---- Plant EVE Landscape (Static, 8 perspectives) ----
    # 纯静态页 + data/ 子目录（页面 fetch data/eve_*.json、data/_audit/*.tsv）。
    # 用 root 而非 alias：与 /phylo/molecular/ 同形 —— alias + try_files 会把
    # alias 值再拼一次完整 uri，子目录容易踩坑；root 形态已由
    # /phylo/molecular/families/family_index.json 实测可用。
    location /eve/ {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        index index.html;
        try_files $uri $uri/ =404;
        expires 10m;
    }

    # ---- Host-Virus Association Explorer (Static Sankey) ----
    location /association/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/association/;
        index index.html;
        try_files $uri $uri/ /association/index.html;
        expires 10m;
    }

    # ---- Interaction Networks (Static force-directed graphs) ----
    # 病毒–宿主网络 + 媒介–病毒–宿主三元组网络。注意页面本身还要 fetch
    # /association/associations.json，所以 /association/ 必须保持可达。
    location /network/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/network/;
        index index.html;
        try_files $uri $uri/ /network/index.html;
        expires 10m;
    }

    # ---- Plant Virus Phylogeny (Static taxonomy tree) ----
    # 分子树子页。必须放在 /phylo/ 之前单独声明，并用 root 而非 alias：
    # alias + try_files 会按 alias+uri 拼路径，导致 /phylo/molecular/ 被兜底到
    # /phylo/index.html（分类树页），分子树页就打不开了。
    location /phylo/molecular/ {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        index index.html;
        try_files $uri $uri/ =404;
        expires 10m;
    }

    location /phylo/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/phylo/;
        index index.html;
        try_files $uri $uri/ /phylo/index.html;
        expires 10m;
    }


    # ---- 2. Primer Database Web (Flask) ----
    location /primers/ {
        rewrite ^/primers/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # ---- 3. Virus Explorer (Dash) ----
    location /explorer/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location /_dash-component-suites/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /_dash-dependencies/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /_dash-update-component/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /_reload-hash/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    # ---- 4. Knowledge RAG ----
    location /knowledge/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    # ---- 5. Literature Tracker ----
    location /literature/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    # ---- 6. Metabuli Classification ----
    location /metabuli/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        client_max_body_size 110m;
        proxy_read_timeout 600s;
    }
    # ---- 蛋白结构总入口（2026-10-08：三页整合成一个入口）----
    # /structures3d/ 外壳两标签：结构总览 / 3D 浏览
    #   2026-10-08 单页化：原「统计面板」标签与「结构总览」是同一模块的两页（指标卡 8 张里 7 张相同），
    #   已并入结构总览一页（页内锚点条定位），外壳只剩两个标签。
    #   index.html     外壳；rvpsd.html = RVPSD Molstar 查看器（原 index.html 改名）
    #   atlas/ 直挂模块 15 的 webapp（不复制文件）
    # 用 alias 且**不加 try_files**：alias + try_files 会把 alias 值再拼一次完整 uri
    # （同 /phylo/molecular/ 的坑），子目录会 404。
    location = /structures3d { return 301 /structures3d/; }
    location /structures3d/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/14.rvpsd_structures/webapp/;
        index index.html;
    }

    # ---- 6b. UniProt Structure Atlas → /structures3d/ 的「结构总览」标签页 ----
    # 直挂模块 15 的 webapp/（不复制文件：webapp/build_data.py 重跑后线上自动生效）。
    # ⚠ 前缀比 /structures3d/ 长，nginx 取最长前缀 → atlas 子路径优先命中这里。
    location /structures3d/atlas/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/webapp/;
        index index.html;
        expires 10m;
    }
    # 2026-10-08 单页化：stats.html 已并入 index.html（页内「缺口与完整率」一节）。
    # 旧 URL 301 回 atlas 首页；旧深链 #stats 由外壳回落 atlas 并滚到该节。
    location = /structures3d/atlas/stats.html { return 301 /structures3d/atlas/; }
    # 构建脚本不进 web
    location = /structures3d/atlas/build_data.py { return 404; }
    # atlas/viewer.html 用相对路径 ../structures_pdb|structures_alphafold|structures_selffold/
    # 读结构文件；它落在 /structures3d/atlas/ 下，所以这三个目录必须挂在 /structures3d/ 一级。
    # 2026-10-08 补传：只传 proteins.json 真正引用的 78 个 PDB cif + 435 个 AFDB cif（398 MB）；
    # structures_selffold/ 被 0 条蛋白引用（sf 字段全空），暂不提供，fold_web 入库后自动生效。
    location /structures3d/structures_pdb/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/structures_pdb/;
        expires 10m;
    }
    location /structures3d/structures_alphafold/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/structures_alphafold/;
        expires 10m;
    }
    # ---- 2026-10-11 基因组蛋白宇宙结构库：AF3 推理 + Modeller 同源模型（磁盘存 .gz，gzip_static 透明服务）----
    location /structures3d/structures_af3/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/structures_af3/;
        gzip_static on;
        expires 10m;
    }
    location /structures3d/structures_homology/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/structures_homology/;
        gzip_static on;
        expires 10m;
    }
    location /structures3d/structures_selffold/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/structures_selffold/;
        gzip_static on;
        expires 10m;
    }
    # 运行期产物（fold 任务库/上传/日志/临时文件）不得经 web 暴露
    location ^~ /structures3d/atlas/colabfold_input/ { return 404; }
    location ~* ^/structures3d/atlas/.*\.(db|log|tmp)$ { return 404; }

    # ---- 旧入口 301（2026-10-08 三页整合）----
    # /uniprot3d/*（Atlas）并到 /structures3d/；原 URL 不再单独保留。
    # ⚠ /help/fold.html（Batch Folding Queue 帮助）**不并**：2026-10-08 后续调整已把该功能
    #   从统一入口摘除，此页仍是独立帮助页（由上面的 `location /help/` 提供）。
    location = /uniprot3d { return 301 /structures3d/; }
    location = /uniprot3d/ { return 301 /structures3d/; }
    location /uniprot3d/ { return 301 /structures3d/; }
    # ---- fold_web (16) — 2026-10-07 决策变更：有限上线 ----
    # 服务器无 GPU：自动预测通道禁用（no_gpu_predict.sh 提示改走上传入库）；
    # 上传结果入库 / Foldify 导出 / 统计面板可用。Basic Auth 锁死，ZIP 上限收紧 2G。
    location /foldweb/ {
        proxy_pass http://127.0.0.1:8800/;
        proxy_set_header Host $host;
        auth_basic "Fold Web Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_foldweb;
        client_max_body_size 2G;
        proxy_read_timeout 300s;
    }

    # ---- 7. Virus Vector Host ----
    location /vector/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- Local JS/CSS libraries (self-hosted CDN deps) ----
    # ---- site-nav.js 全站导航单一出处：不缓存，改导航立即生效 (2026-10-13) ----
    location = /lib/site-nav.js {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /lib/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/lib/;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
    }
    location = /favicon-aphid.svg { alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/favicon-aphid.svg; }
    location = /favicon.svg { alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/favicon.svg; }
    location = /robots.txt { alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/robots.txt; }
    location = /sitemap.xml { alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/sitemap.xml; }

    # ---- Rate-limited job submission endpoints ----
    location ~ ^/metabuli/(classify|cdd|blastn|blastx|local_blast|primer_design)$ {
        limit_req zone=pvdb_submit burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 110m;
        proxy_read_timeout 600s;
    }


    # ---- Virus Profile：应用已于 2026-09 归档（见 CHANGELOG「13.virus_profile 已停用」），
    #      功能并入 Virus Explorer 的「病毒档案」Tab。原先 proxy_pass 到 5006（无人监听）
    #      导致 6 处导航链接 502 → 改为 301，把用户送到现役入口。
    # 2026-10-16: 透传物种段 —— app.py 的 /virus/<物种> 深链语义搬到 nginx 层。
    # 原 `return 301 /explorer/;` 会把物种丢掉，全局检索框的 Explorer 深链依赖这里。
    location /virus/ {
        rewrite ^/virus/(.+)$ /explorer/?profile=$1 permanent;
        return 301 /explorer/;
    }
    location = /virus { return 301 /explorer/; }

    # ---- Root: serve portal page ----
    location = /i18n.js { root /opt/plant_virus_db/plant_virus_db_pipeline/docs; expires 1h; }
    location = / {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        try_files /index.html =404;
        # 首页 HTML 不缓存：防止浏览器启发式缓存导致改版后看不到新内容 (2026-10-07)
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # ---- 兜底：docs/ 下的静态文件按根路径直接服务 ----
    # 原先**没有 location / 前缀块** → 未显式声明的路径匹配不到任何 location，落到编译期
    # 默认 root（/usr/share/nginx/html，其 index.html 是指向 nginx 自带测试页的符号链接），
    # 于是 GET /index.html 返回发行版测试页；/download.html、/nonsegmented.html、
    # /segmented.html、/README.md 则 404（文件其实都在 docs/ 下）。
    # location / 是最短前缀，所有既有 location 都比它更具体 → 不受影响。
    location / {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        try_files $uri $uri/ =404;
    }
    # ---- 备份文件不外露：docs/ 下散落 *.bak_*，原先经 /reference/ 别名可直接下载 ----
    # 备份文件不外露：docs/ 下散落 *.bak_*、*_bak，原先经 /reference/ 别名可直接下载。
    # `_bak($|[_.])` 是 2026-09-22 补的 —— 原模式 `\.bak[_.]` 匹配不到
    # `lib/plotly.min.js.truncated_bak` 这类「没有 .bak 的 _bak 结尾」文件。
    location ~* (\.bak[_.]|_bak($|[_.])) { return 404; }
    # ---- 更名/停用的应用路由 → 301 到现役入口（literature 页导航在用）----
    location = /miRNA/ { return 301 /pamirdb/; }
    location = /miRNA  { return 301 /pamirdb/; }
    # ---- API for primers ----
    # 2026-10-12: /api/chat exact-match rate limit - site-wide AI assistant
    # endpoint falls back to the server key when keyless (same trust level
    # as /knowledge/query), so it must be rate-limited the same way.
    location = /api/chat {
        limit_req zone=pvdb_llm burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # ---- Primer Flask internal routes ----
    location /species/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /primer/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /search {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /browse {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /download {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ---- Gene Atlas ----
    location = /genes { return 301 /genes/; }
    # 2026-10-08 缓存：/genes 下的 **HTML 入口**不缓存（同首页 2026-10-07 的处理）——
    #   仪表盘、gene_browser.html、统计页都会随数据重建，1h 缓存会让改版/换数据后看不到新内容。
    #   该目录的 fasta/tsv/png 等下载件仍走 expires 1h。
    #   ⚠ 只给 `/genes/data/index.html` 一条精确匹配即可：前缀块里的 `index index.html`
    #     会**内部重定向**到它，由它决定响应头。
    #     **别**写成 `location = /genes/data/` + alias 指向文件 —— location 以 `/` 结尾时
    #     nginx 会把 alias 当目录再拼一次 index，得到 `index.htmlindex.html` → **500**（已实测）。
    location = /genes/data/index.html {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/genes/data/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /genes/data/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/genes/data/;
        index index.html;
        expires 1h;
    }
    location /genes/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/genes/;
        # 2026-10-08 入口语义统一：/genes/ 落到模块仪表盘 index.html。
        # 原先落 gene_browser.html，使 /genes/ 与 /genes/gene_browser.html 同页，
        # 首页卡片与全站导航条都跳过仪表盘（仪表盘只剩浏览器 Dashboard 一个入口）。
        index index.html;
        # 2026-10-08 缓存：原先 expires 1h —— 但 /genes/ 下就是仪表盘与 gene_browser.html，
        #   两者都随数据重建，1h 缓存会让改版/换数据后看不到新内容。
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Help & Resources ----
    location /help/ { alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/help/; index index.html; }
    location = /resources.html {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/resources.html;
    }

    # ---- Photos ----
    location = /photos { return 301 /photos/; }
    location /photos/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/;
        index photos.html;
    }
    location /photos/data/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/data/;
        expires 1h;
        add_header Access-Control-Allow-Origin *;
    }

    # ---- 1KP Virome Dashboard (Dash) ----
    location /onekp/ {
        proxy_pass http://127.0.0.1:8051/onekp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # ---- PAmiRDB ----
    location /pamirdb/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }


    # ---- 8. Phylogeography (Dash, 时间/地理分析) ----
# OFFLINE-20260917:     location /phylogeography/ {
# OFFLINE-20260917:         proxy_pass http://127.0.0.1:8053;
# OFFLINE-20260917:         proxy_set_header Host $host;
# OFFLINE-20260917:         proxy_set_header X-Real-IP $remote_addr;
# OFFLINE-20260917:         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# OFFLINE-20260917:         proxy_set_header X-Forwarded-Proto $scheme;
# OFFLINE-20260917:         proxy_read_timeout 600s;
# OFFLINE-20260917:         proxy_buffering off;
# OFFLINE-20260917:     }
    # ---- 9. RDP Recombination Analysis (Dash) ----
# OFFLINE-20260917:     location /rdp/ {
# OFFLINE-20260917:         proxy_pass http://127.0.0.1:8052;
# OFFLINE-20260917:         proxy_set_header Host $host;
# OFFLINE-20260917:         proxy_set_header X-Real-IP $remote_addr;
# OFFLINE-20260917:         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# OFFLINE-20260917:         proxy_set_header X-Forwarded-Proto $scheme;
# OFFLINE-20260917:         proxy_read_timeout 1800s;
# OFFLINE-20260917:         proxy_buffering off;
# OFFLINE-20260917:     }
}

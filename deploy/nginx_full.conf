# ===================================================
# Plant Virus: Database Server
# ===================================================
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10M;

    # ---- Root: portal page ----
    location = / {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        try_files /index.html =404;
    }

    # ---- Reference Database (Static) ----
    location /reference/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/;
        index reference_index.html;
    }
    location /reference/data/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/data/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # ---- Photos ----
    location = /photos { return 301 /photos/; }
    location /photos/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/;
        index photos.html;
    }
    location /photos/data/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/data/;
        expires 1h;
        add_header Access-Control-Allow-Origin *;
    }

    # ---- TE & EVE Database (RETIRED 2026-09-23 -> /eve/) ----
    # TE（转座子）与植物病毒无关，与 /eve/ 也不是同一分析 —— 整个 /te/ 下线，
    # docs/te/ 已移出服务目录（改放 archive/_pending_delete_20260923/）。
    # 保留 301 而非 404：旧外链与书签仍能落到 /eve/。
    # 注：/te/ 必须同时声明 `=` 与 `/te/` 两条 —— 前缀块不匹配裸 /te，
    #     否则裸 /te 会落到 `location /` 兜底变成 404。
    location = /te { return 301 /eve/; }
    location /te/ { return 301 /eve/; }

    # ---- Plant EVE Landscape (Static, 8 perspectives) ----
    # 纯静态页 + data/ 子目录（页面 fetch data/eve_*.json、data/_audit/*.tsv）。
    # 用 root 而非 alias：与 /phylo/molecular/ 同形 —— alias + try_files 会把
    # alias 值再拼一次完整 uri，子目录容易踩坑；root 形态已由
    # /phylo/molecular/families/family_index.json 实测可用。
    location /eve/ {
        root /opt/plant_virus_db/plant_virus_db_pipeline/docs;
        index index.html;
        try_files $uri $uri/ =404;
        expires 10m;
    }

    # ---- Genes ----
    location = /genes { return 301 /genes/; }
    location /genes/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/genes/;
        index gene_browser.html;
    }

    # ---- Help ----
    location /help/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/help/;
        index index.html;
    }

    # ---- Resources ----
    location = /resources.html {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/docs/resources.html;
    }

    # ---- OneKP Virome ----
    location /onekp/ {
        proxy_pass http://127.0.0.1:8051/onekp/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # ---- Phylogeography ----
    location /phylogeography/ {
        proxy_pass http://127.0.0.1:8051/phylogeography/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # ---- Primers (Flask) ----
    location /primers/ {
        rewrite ^/primers/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /search { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location = /browse { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location = /download { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 120s; }

    # ---- Virus Explorer (Dash) ----
    location /explorer/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location /_dash-component-suites/ { proxy_pass http://127.0.0.1:8050; proxy_set_header Host $host; proxy_buffering off; }
    location /_dash-dependencies/ { proxy_pass http://127.0.0.1:8050; proxy_set_header Host $host; proxy_buffering off; }
    location /_dash-update-component/ { proxy_pass http://127.0.0.1:8050; proxy_set_header Host $host; proxy_buffering off; }
    location /_reload-hash/ { proxy_pass http://127.0.0.1:8050; proxy_set_header Host $host; proxy_buffering off; }

    # ---- Metabuli ----
    location /metabuli/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        client_max_body_size 110m;
        proxy_read_timeout 600s;
    }

    # ---- Knowledge RAG ----
    location /knowledge/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- Literature Tracker ----
    location /literature/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- Vector-Host ----
    location /vector/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- Virus Profile ----
    location /virus/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- RVPSD Protein Structure (14, static; 线上在 conf.d/plant-virus.conf, 此处补记) ----
    location = /structures3d { return 301 /structures3d/; }
    location /structures3d/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/14.rvpsd_structures/webapp/;
        index index.html;
    }

    # ---- UniProt Structure Atlas (15, static) ----
    # 挂模块根而非 webapp/：viewer.html 用相对路径 ../structures_pdb|alphafold|selffold/
    # 读结构文件，必须让 /uniprot3d/ 直达模块根。alias 下不要加 try_files（同 /phylo/ 坑）。
    location = /uniprot3d { return 301 /uniprot3d/; }
    location = /uniprot3d/webapp { return 301 /uniprot3d/; }
    location = /uniprot3d/webapp/ { return 301 /uniprot3d/; }
    location /uniprot3d/ {
        alias /opt/plant_virus_db/plant_virus_db_pipeline/15.uniprot_plant_virus_structures/;
        index webapp/index.html;
        expires 10m;
    }
    # 运行期产物（fold 任务库/上传/日志/临时文件）不得经 web 暴露
    location ^~ /uniprot3d/colabfold_input/ { return 404; }
    location ~* ^/uniprot3d/.*\.(db|log|tmp)$ { return 404; }

    # ---- fold_web (16) —— 刻意不反代 ----
    # 应用无鉴权且面向 GPU 服务器本地运维，公网暴露等于开放任意 ColabFold 计算任务提交。
    # 使用方式见 /help/fold.html；确需远程使用请走 SSH 端口转发后访问 127.0.0.1:8800。

    # ---- PAmiRDB ----
    location /pamirdb/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

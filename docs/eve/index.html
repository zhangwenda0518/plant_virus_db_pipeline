<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f4f6f8;color:#2c3e50;overflow-x:hidden}

/* ── top bar ── */
nav.topbar{background:linear-gradient(135deg,#134e6f 0%,#1a5276 55%,#2e86c1 100%);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
nav.topbar .brand{font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
nav.topbar .brand a{color:#fff;text-decoration:none}
nav.topbar .sep{opacity:.35}
nav.topbar .subtitle{font-size:13px;opacity:.92;font-weight:600;white-space:nowrap}
nav.topbar .stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav.topbar .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:3px 10px;font-size:11.5px;white-space:nowrap}
nav.topbar .chip b{font-weight:700}

/* ── layout ── */
.layout{display:flex;gap:14px;padding:14px 16px;align-items:stretch;max-width:1760px;margin:0 auto}
.panel{background:#fff;border:1px solid #eef2f5;border-radius:14px;box-shadow:0 2px 10px rgba(20,60,90,.06)}
aside.controls{width:288px;flex-shrink:0;padding:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 130px);overflow-y:auto;position:sticky;top:14px}
section.chartcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
aside.detail{width:330px;flex-shrink:0;padding:14px;max-height:calc(100vh - 130px);overflow-y:auto;position:sticky;top:14px;display:none}
aside.detail.open{display:block}
@media(max-width:1150px){aside.detail{position:static;max-height:none;width:100%}.layout{flex-direction:column}aside.controls{position:static;max-height:none;width:100%}}

/* ── controls ── */
.ctl-title{font-size:12px;font-weight:700;color:#8a99a8;letter-spacing:.6px;border-left:3px solid #2e86c1;padding-left:8px;margin:2px 0 8px}
.viewlist{display:flex;flex-direction:column;gap:5px}
.viewlist button{text-align:left;padding:7px 10px;border:1px solid #e2e8ee;background:#fff;color:#3c4b5b;border-radius:9px;font-size:12.5px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
.viewlist button:hover{border-color:#2e86c1;background:#eef5fa}
.viewlist button.on{background:#2e86c1;border-color:#2e86c1;color:#fff;font-weight:600}
.viewlist button .ic{width:16px;text-align:center;opacity:.85;font-size:13px}
select,.sel{width:100%;padding:6px 8px;border:1px solid #d5dde5;border-radius:8px;font-size:12.5px;background:#fff;color:#2c3e50;outline:none}
select:focus{border-color:#2e86c1}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#3c4b5b;cursor:pointer;padding:2.5px 0;user-select:none}
.chk input{accent-color:#2e86c1;width:14px;height:14px;flex-shrink:0}
.chk .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.hint{font-size:11px;color:#95a5b5;line-height:1.6}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
button.act{flex:1;min-width:66px;padding:7px 10px;border:1px solid #d5dde5;background:#fff;color:#3c4b5b;border-radius:8px;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
button.act:hover{border-color:#2e86c1;color:#1a5276;background:#eef5fa}
button.act.primary{background:#2e86c1;border-color:#2e86c1;color:#fff}
.legend{font-size:11px;color:#7b8a99;line-height:1.75}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}

/* ── chart ── */
.chart-head{display:flex;align-items:flex-start;gap:10px;padding:12px 16px 0;flex-wrap:wrap}
.chart-head .t{font-size:15px;font-weight:700;color:#1a5276;line-height:1.4}
.chart-head .st{font-size:11.5px;color:#8a99a8;margin-top:2px;line-height:1.5}
.chart-head .mode{margin-left:auto;display:flex;border:1px solid #d5dde5;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.chart-head .mode button{border:none;background:#fff;padding:6px 13px;font-size:12px;cursor:pointer;color:#3c4b5b}
.chart-head .mode button.on{background:#2e86c1;color:#fff}
#chart{width:100%;height:calc(100vh - 265px);min-height:460px}
@media(max-width:1150px){#chart{height:560px}}
#notes{padding:0 16px 14px;font-size:11.5px;color:#8a99a8;line-height:1.75}
#notes b{color:#5a6b7b}
.loading{padding:80px 20px;text-align:center;color:#7b8a99;font-size:14px}
.spinner{width:34px;height:34px;border:3px solid #e3ecf3;border-top-color:#2e86c1;border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── detail panel ── */
#detail .dt{font-size:14px;font-weight:700;color:#1a5276;line-height:1.5;word-break:break-word}
#detail .sub{font-size:11.5px;color:#8a99a8;margin:3px 0 10px}
#detail .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#detail .kv .c{background:#f7fafc;border:1px solid #eef2f5;border-radius:10px;padding:8px 10px}
#detail .kv .c b{display:block;font-size:16px;color:#1a5276}
#detail .kv .c span{font-size:10.5px;color:#95a5b5}
#detail h4{margin:12px 0 6px;font-size:12px;color:#8a99a8;letter-spacing:.5px}
.linkrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:pointer;font-size:12px}
.linkrow:hover{background:#eef5fa}
.linkrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .v{color:#7b8a99;font-size:11px;flex-shrink:0}
.barwrap{height:5px;background:#eef2f5;border-radius:3px;overflow:hidden;flex-shrink:0;width:50px}
.barwrap i{display:block;height:100%;border-radius:3px}
#detail .backlink{font-size:11.5px;color:#2e86c1;cursor:pointer;text-decoration:none}

/* ── footer ── */
footer{max-width:1760px;margin:0 auto;padding:10px 20px 24px;font-size:11.5px;color:#95a5b5;line-height:1.85}
footer a{color:#2e86c1;text-decoration:none}

(function () {

    var host = document.querySelector('nav.topbar .stats');
    if (!b || !host || b.parentNode === host) return !!b;
    b.style.cssText = 'position:static;width:auto;height:auto;min-width:52px;'
      + 'padding:3px 10px;border-radius:14px;font-size:11.5px;font-weight:600;line-height:1.5;'

      + 'color:#fff;box-shadow:none;cursor:pointer;font-family:inherit;'
      + 'display:inline-flex;align-items:center;justify-content:center;white-space:nowrap';
    host.appendChild(b);
    return true;
  }
  function go() {
    if (adopt()) return;
    var n = 0, t = setInterval(function () { if (adopt() || ++n > 50) clearInterval(t); }, 80);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();

<script>
/* ============================================================
 * Plant EVE Landscape — /eve/
 * Data: docs/eve/data/{eve_landscape,eve_dynamics,eve_phylo}.json
 * Built by docs/eve/build_eve_data.py on the analysis server (246).
 * ============================================================ */
(function () {
'use strict';

function T(en, zh) {
  return (window.PVDB_i18n && PVDB_i18n.lang() === 'zh') ? zh : en;
}

/* ---------- palette ---------- */
var VCOL = {
  'dsDNA-RT': '#7d3c98', 'ssDNA': '#2980b9', 'dsDNA': '#16a085',
  'dsRNA': '#e67e22', 'ssRNA+': '#c0392b', 'ssRNA-': '#d35400',
  'phage': '#95a5a6', 'unclassified': '#c9d6e2'
};
var VLAB = {};
function relabelV() {
  VLAB = {
    'dsDNA-RT': T('dsDNA-RT (pararetrovirus)', 'dsDNA-RT（副逆转录）'),
    'ssDNA': 'ssDNA', 'dsDNA': 'dsDNA', 'dsRNA': 'dsRNA',
    'ssRNA+': 'ssRNA+', 'ssRNA-': 'ssRNA-',
    'phage': T('phage (bacterial)', '噬菌体'),
    'unclassified': T('unclassified', '未细分')
  };
}
var GCOL = {
  algae: '#16a085', bryophyte: '#27ae60', fern: '#2ecc71', gymnosperm: '#00695c',
  basal_angiosperm: '#9b59b6', magnoliid: '#e74c3c', monocot: '#e67e22',
  eudicot: '#2980b9', unknown: '#bdc3c7'
};
var DNA_T = { 'dsDNA-RT': 1, 'ssDNA': 1, 'dsDNA': 1 };
var RNA_T = { 'dsRNA': 1, 'ssRNA+': 1, 'ssRNA-': 1 };
var GLAB = {};
function relabelG() {
  GLAB = {
    algae: T('Algae', '藻类'), bryophyte: T('Bryophytes', '苔藓'),
    fern: T('Ferns & allies', '蕨类及近缘'), gymnosperm: T('Gymnosperms', '裸子植物'),
    basal_angiosperm: T('Basal angiosperms', '基部被子植物'),
    magnoliid: T('Magnoliids', '木兰类'), monocot: T('Monocots', '单子叶'),
    eudicot: T('Eudicots', '真双子叶'), unknown: T('Unplaced', '未定位')
  };
}

/* ---------- views ---------- */
var VIEWS = [
  { id: 'virus', ic: '◉', en: 'Virus taxa', zh: '病毒类群' },
  { id: 'host',  ic: '❖', en: 'Host families', zh: '宿主科' },
  { id: 'dnarna', ic: '◐', en: 'DNA / RNA duality', zh: 'DNA / RNA 二重性' },
  { id: 'matrix', ic: '▦', en: 'Virus × host matrix', zh: '病毒 × 宿主矩阵' },
  { id: 'past',  ic: '◑', en: 'Past vs present', zh: '古今对照' },
  { id: 'amp',   ic: '◈', en: 'Amplification dynamics', zh: '扩增动力学' },
  { id: 'tree',  ic: '⑂', en: 'RT phylogeny', zh: 'RT 系统发育' },
  { id: 'qc',    ic: '✚', en: 'Cases & QC', zh: '案例与质控' }
];

/* ---------- state ---------- */
var S = {
  view: 'virus', topn: 20,
  offType: {}, offGroup: {}, sub: 0
};
var D = {};                 // loaded json
var CH = null;              // echarts instance
var LAST = null;            // last rendered option (for CSV export)

/* ---------- boot ---------- */
function qs(k) { var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; }

Promise.all([
  fetch('data/eve_landscape.json').then(function (r) { return r.json(); }),
  fetch('data/eve_dynamics.json').then(function (r) { return r.json(); }),
  fetch('data/eve_phylo.json').then(function (r) { return r.json(); })
]).then(function (a) {
  D.land = a[0]; D.dyn = a[1]; D.phy = a[2];
  init();
}).catch(function (e) {
  document.getElementById('chart').innerHTML =
    '<div class="loading" style="color:#c0392b">Failed to load data: ' + e + '</div>';
});

function init() {
  relabelV(); relabelG();
  var ov = D.land.overview;
  document.getElementById('st-loci').textContent = fmt(ov.loci);
  document.getElementById('st-gen').textContent = fmt(ov.genomes);
  document.getElementById('st-hf').textContent = fmt(ov.host_families);
  document.getElementById('st-ratio').textContent = D.land.dna_rna.ratio + ' : 1';
  document.getElementById('ftMeta').textContent =
    T('Dataset frozen 2026-09-23 · tier1 ' + fmt(ov.loci_tier1) + ' + tier2 ' + fmt(ov.loci_tier2) +
      ' = ' + fmt(ov.loci) + ' loci · raw incl. phiX ' + fmt(ov.loci_raw) + ' · phiX removed ' + fmt(ov.phix_loci),
      '数据集冻结于 2026-09-23 · tier1 ' + fmt(ov.loci_tier1) + ' + tier2 ' + fmt(ov.loci_tier2) +
      ' = ' + fmt(ov.loci) + ' 位点 · 含 phiX 原始 ' + fmt(ov.loci_raw) + ' · 已剔 phiX ' + fmt(ov.phix_loci));

  buildViewList(); buildFilters();
  var v = qs('view'); if (v && VIEWS.some(function (x) { return x.id === v; })) S.view = v;
  var n = qs('topn'); if (n) { S.topn = +n; document.getElementById('topn').value = n; }
  var off = qs('off'); if (off) off.split(',').forEach(function (k) { S.offType[k] = 1; });
  var offg = qs('offg'); if (offg) offg.split(',').forEach(function (k) { S.offGroup[k] = 1; });

  CH = echarts.init(document.getElementById('chart'));
  window.addEventListener('resize', function () { CH.resize(); });
  CH.on('click', onChartClick);

  document.getElementById('topn').addEventListener('change', function () {
    S.topn = +this.value; render();
  });
  document.getElementById('btnPng').addEventListener('click', exportPng);
  document.getElementById('btnCsv').addEventListener('click', exportCsv);
  document.getElementById('btnReset').addEventListener('click', resetAll);
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#pvdb-lang-btn')) {
      setTimeout(function () { relabelV(); relabelG(); buildViewList(); buildFilters(); render(); }, 90);
    }
  });
  render();
}

function buildViewList() {
  var box = document.getElementById('viewlist');
  box.innerHTML = '';
  VIEWS.forEach(function (v) {
    var b = document.createElement('button');
    b.dataset.view = v.id;
    b.innerHTML = '<span class="ic">' + v.ic + '</span><span>' + T(v.en, v.zh) + '</span>';
    b.addEventListener('click', function () { S.view = v.id; S.sub = 0; render(); });
    box.appendChild(b);
  });
}

function buildFilters() {
  var ft = document.getElementById('ftype'), fg = document.getElementById('fgroup');
  ft.innerHTML = ''; fg.innerHTML = '';
  var seenT = {};
  D.land.dna_rna.by_type.forEach(function (t) {
    if (seenT[t.t]) return; seenT[t.t] = 1;
    ft.appendChild(chk(t.t, VCOL[t.t] || '#c9d6e2', VLAB[t.t] || t.t, S.offType, 'type'));
  });
  D.land.group_order.forEach(function (g) {
    var n = D.land.host_families.filter(function (h) { return h.grp === g; }).length;
    if (!n) return;
    fg.appendChild(chk(g, GCOL[g] || '#bdc3c7', (GLAB[g] || g) + ' (' + n + ')', S.offGroup, 'group'));
  });
}
function chk(key, col, label, store, kind) {
  var l = document.createElement('label');
  l.className = 'chk';
  var i = document.createElement('input');
  i.type = 'checkbox'; i.checked = !store[key];
  i.addEventListener('change', function () {
    if (this.checked) delete store[key]; else store[key] = 1;
    render();
  });
  var sw = document.createElement('span');
  sw.className = 'sw'; sw.style.background = col;
  var sp = document.createElement('span'); sp.textContent = label;
  l.appendChild(i); l.appendChild(sw); l.appendChild(sp);
  return l;
}

/* ---------- filtering helpers ---------- */
function typeOn(t) { return !S.offType[t]; }
function groupOn(g) { return !S.offGroup[g]; }
function vTaxa() {
  return D.land.virus_taxa.filter(function (t) { return typeOn(t.t); });
}
function hFams() {
  return D.land.host_families.filter(function (h) { return groupOn(h.grp); });
}

function render() {
  var vl = document.querySelectorAll('#viewlist button');
  for (var i = 0; i < vl.length; i++) vl[i].classList.toggle('on', vl[i].dataset.view === S.view);
  var V = VIEWS.filter(function (x) { return x.id === S.view; })[0];
  document.getElementById('viewTitle').textContent = T(V.en, V.zh);
  var sub = document.getElementById('submodes'); sub.innerHTML = '';
  CH.clear();
  ({ virus: rVirus, host: rHost, dnarna: rDnaRna, matrix: rMatrix,

    ],

      {

      },

          .map(function (g) { return { value: [g.s, g.e], name: g.g, fam: g.f, p: g.p, itemStyle: { color: GCOL[g.p] || '#bdc3c7', opacity: .7 } }; }),
        emphasis: { itemStyle: { borderColor: '#1a5276', borderWidth: 1.5 } }
      }

  }, true);
  setLegend([[T('cluster-size spectrum (all 9,864 clusters)', '簇大小谱（全部 9,864 簇）'), '#2e86c1'], [T('per-genome scatter, coloured by host group', '每基因组散点，按宿主类群着色'), '#00695c']]);
  setNotes(T(

    '<b>多数 EVE 保持低拷贝，少数爆发式扩增。</b>花椰菜科最富集的前 20 个基因组的 15,292 个位点，在 95% identity 下聚成 9,864 簇；≥10 拷贝的大簇 52 个，最大单簇 217 拷贝。下图中 EVE 数随基因组增大而增加（Spearman rho = 0.349，n = 1,401）——大基因组能容忍更多寄生序列。裸子植物（深绿）位于右上：巨大基因组、巨大元件海洋。'));
}

/* ============================================================
 * VIEW 7 — RT phylogeny
 * ============================================================ */
var NWK_CACHE = null;
function parseNewick(s) {
  if (NWK_CACHE) return NWK_CACHE;
  var i = 0;
  function skip() { while (i < s.length && (s[i] === ' ' || s[i] === '\n' || s[i] === '\r')) i++; }
  function parse() {
    skip();
    var node = { name: '' };
    if (s[i] === '(') {
      i++; node.children = [];
      for (;;) {
        node.children.push(parse());
        skip();
        if (s[i] === ',') { i++; continue; }
        if (s[i] === ')') { i++; break; }
        break;
      }
    }
    skip();
    if (s[i] === '[') { while (i < s.length && s[i] !== ']') i++; i++; }
    var st = i;
    while (i < s.length && ':,()'.indexOf(s[i]) < 0) i++;
    node.name = s.slice(st, i).trim();
    if (s[i] === ':') {
      i++; var a = i;
      while (i < s.length && ',)'.indexOf(s[i]) < 0) i++;
      node.length = parseFloat(s.slice(a, i)) || 0;
    }
    return node;
  }
  NWK_CACHE = parse();
  return NWK_CACHE;
}
function famOf(leaf) {
  var g = leaf.split('|')[0];
  var h = D.land.host_families.filter(function (x) { return x.n === g; })[0];
  return null;
}
function rTree() {
  var root = parseNewick(D.phy.tree_newick);
  var famByGenome = {};
  D.land.host_families.forEach(function (h) { famByGenome[h.n] = h; });
  // build genome -> family via per-genome data (dynamics.genomes has g/f/p)
  var g2f = {};
  D.dyn.genomes.forEach(function (g) { g2f[g.g] = g; });

  var leaves = 0, maxDepth = 0;
  function walk(n, d) {
    if (d > maxDepth) maxDepth = d;
    if (!n.children) { leaves++; return; }
    n.children.forEach(function (c) { walk(c, d + 1); });
  }
  walk(root, 0);

  function decorate(n) {
    var isLeaf = !n.children;
    var node = { name: n.name };
    if (isLeaf) {
      var genome = n.name.split('|')[0];
      var info = g2f[genome];
      var isRef = n.name.indexOf('REF_') === 0;
      var col = isRef ? '#c0392b' : (info && GCOL[info.p] ? GCOL[info.p] : '#bdc3c7');
      var short = n.name.length > 34 ? n.name.slice(0, 33) + '…' : n.name;
      node.value = n.length || 0.001;
      node.itemStyle = { color: col, borderColor: col };
      node.label = { show: true, fontSize: 8.5, color: isRef ? '#c0392b' : '#5a6b7b', formatter: short };
      node._leaf = true;
    } else {
      node.value = n.length || 0.001;
      node.itemStyle = { color: '#b8c6d4', borderColor: '#b8c6d4' };
      node.label = { show: false };
    }
    if (n.children) node.children = n.children.map(decorate);
    return node;
  }
  var tree = decorate(root);
  var H = Math.max(520, leaves * 13);
  var el = document.getElementById('chart');
  el.style.height = H + 'px';
  CH.resize();
  setSub(T(leaves + ' tips (' + (leaves - 19) + ' EVE + 19 reference) · ML tree on the Pfam RVT_1 domain',
           leaves + ' 个叶（' + (leaves - 19) + ' EVE + 19 参考）· Pfam RVT_1 域的最大似然树'));
  CH.setOption({
    tooltip: {
      formatter: function (p) {
        var nm = p.data.name || '';
        if (nm.indexOf('REF_') === 0) return '<b>' + nm.replace('REF_', '').replace(/_/g, ' ') + '</b><br>' + T('reference virus', '参考病毒');
        var genome = nm.split('|')[0], info = g2f[genome];
        return '<b>' + genome + '</b><br>' + (info ? (info.f || '') + (info.p ? ' · ' + (GLAB[info.p] || info.p) : '') : '');
      }
    },
    series: [{
      type: 'tree', data: [tree], orient: 'LR', layout: 'orthogonal',
      top: 8, bottom: 8, left: 130, right: 210,
      symbol: 'circle', symbolSize: 4.5,
      initialTreeDepth: -1,
      expandAndCollapse: false,
      roam: true,
      lineStyle: { color: '#c8d6e2', width: .8 },
      leaves: { label: { position: 'right' } }
    }]
  }, true);
  var same = D.phy.tree_neighbor_same, tot = D.phy.tree_neighbor_total, ref = D.phy.tree_neighbor_ref;
  setLegend([[T('tip colour = host plant group', '叶色 = 宿主植物类群'), '#00695c'],
             [T('red = reference virus', '红色 = 参考病毒'), '#c0392b'],
             [T('nearest neighbour same host family: ' + same + '/' + tot + ' (' + (100 * same / tot).toFixed(1) + '%)', '最近邻同宿主科：' + same + '/' + tot + '（' + (100 * same / tot).toFixed(1) + '%）'), '#2e86c1'],
             [T('sequence-level nearest reference, same family: ' + D.phy.nearest_ref_same_family + '/' + (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family), '序列级最近参考同科：' + D.phy.nearest_ref_same_family + '/' + (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family)), '#7d3c98']]);
  setNotes(T(
    '<b>Scroll / drag / zoom the tree</b> (269 tips; topological layout, branch lengths not to scale). ' +
    '<b>Two different questions, two different answers.</b> On the tree, <b>' + same + '/' + tot + ' (' + (100 * same / tot).toFixed(1) + '%)</b> of EVEs sit nearest to another EVE from the <b>same</b> host family — a clear signal of vertical, host-linked inheritance (some pairs have distance 0, i.e. near-identical copies). But when each EVE is instead matched to the nearest <b>extant reference virus</b> by sequence, only <b>' + D.phy.nearest_ref_same_family + '/' + (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family) + ' (' + (100 * D.phy.nearest_ref_same_family / (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family)).toFixed(1) + '%)</b> stay within the family — partly genuine host jumping, partly reference-panel bias: 19 reference viruses are mostly crop viruses, and <b>Cauliflower mosaic virus alone is the nearest reference for 920 EVEs</b>.',
    '<b>两个问题，两个答案。</b>在树上，<b>' + same + '/' + tot + '（' + (100 * same / tot).toFixed(1) + '%）</b>的 EVE 其最近邻是<b>同宿主科</b>的另一条 EVE——垂直、宿主连锁遗传的明确信号（部分配对树距离为 0，即近乎相同的拷贝）。但若改为按序列匹配<b>现存参考病毒</b>，仅 <b>' + D.phy.nearest_ref_same_family + '/' + (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family) + '（' + (100 * D.phy.nearest_ref_same_family / (D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family)).toFixed(1) + '%）</b>落在同科——这既有真实的宿主跳跃，也含参考面板偏倚：21 个参考病毒多为农作物病毒，仅<b>花椰菜花叶病毒一种就当了 920 条 EVE 的最近参考</b>。'));
}
function rTreeReset() { var el = document.getElementById('chart'); el.style.height = ''; }

/* ============================================================

 * ============================================================ */
function rQc() {
  var C = D.phy.cases, q = D.phy.qc_phix, v = D.phy.viroid;
  var A = C.Datisca_glomerata, B = C.Alsophila_spinulosa;

           '高置信 RNA EVE 案例 · phiX174 污染 · 类病毒'));

  CH.setOption({

      { gridIndex: 1, type: 'category', data: qcSorted.map(function (x) { return x.g; }), axisLabel: { fontSize: 9.5 } },
      { gridIndex: 2, type: 'category', data: [T('CEVd-like', 'CEVd 样'), T('other viroids', '其他类病毒')], axisLabel: { fontSize: 10 } }
    ],
    series: [
      {
        type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 26,
        data: [
          { value: A.loci, itemStyle: { color: '#7d3c98', borderRadius: [0, 3, 3, 0] } },
          { value: B.loci, itemStyle: { color: '#7d3c98', borderRadius: [0, 3, 3, 0] } }
        ],
        label: { show: true, position: 'right', fontSize: 10, color: '#7b8a99', formatter: function (p) { return p.value + T(' loci', ' 位点'); } }
      },
      {
        type: 'bar', xAxisIndex: 1, yAxisIndex: 1, barMaxWidth: 20,
        data: qcSorted.map(function (x) { return { value: x.pct, itemStyle: { color: x.pct > 50 ? '#c0392b' : '#e67e22', borderRadius: [0, 3, 3, 0] } }; }),
        label: { show: true, position: 'right', fontSize: 9.5, color: '#7b8a99', formatter: function (p) { return p.value + '%'; } }
      },
      {
        type: 'bar', xAxisIndex: 2, yAxisIndex: 2, barMaxWidth: 22,
        data: [
          { value: v.length ? v[0].n : 0, itemStyle: { color: '#16a085', borderRadius: [0, 3, 3, 0] } },
          { value: v.slice(1).reduce(function (s, x) { return s + x.n; }, 0), itemStyle: { color: '#bdc3c7', borderRadius: [0, 3, 3, 0] } }
        ],
        label: { show: true, position: 'right', fontSize: 10, color: '#7b8a99' }
      }
    ]
  }, true);
  setLegend([[T('RNA EVE case loci (single viral family dominates, most with complete ORF)', 'RNA EVE 案例位点（单一病毒类群主导，多数含完整 ORF）'), '#7d3c98'],
             [T('phiX174 spike-in share of viral_supported loci', 'phiX174 内参占 viral_supported 位点比例'), '#c0392b'],
             [T('viroid-screening genomes', '类病毒筛查基因组数'), '#16a085']]);
  setNotes(T(
    '<b>Cases.</b> <i>Datisca glomerata</i> (Datiscaceae): 23 RNA EVE loci, 22 of them unclassified Betaflexiviridae, 14 with a complete ORF (≥60 aa). <i>Alsophila spinulosa</i> (Cyatheaceae, tree fern): 19 loci, 15 Mitoviridae, 16 with a complete ORF. Single-family dominance plus a high complete-ORF fraction is what a real integration looks like, not a fragmented false positive.<br><b>phiX174.</b> One assembly (<i>Abies alba</i>) contributed 55,725 of the 55,737 contaminating loci (94.1% of its own calls) — an Illumina library spike-in. Removed genome-wide; the remaining genomes carry 1–3 loci each.<br><b>Viroids.</b> A CEVd-like signal appears in 1,374/1,526 genomes (90%), but most of it falls in soft-masked repeats and its identity does not decay across distant hosts — more consistent with a repetitive element than with an endogenous viroid. Whether CEVd itself is present stays an <b>open question</b>, flagged as such.',
    '<b>案例。</b><i>Datisca glomerata</i>（四数木科）：23 个 RNA EVE 位点，其中 22 个为未细分 Betaflexiviridae，14 个含完整 ORF（≥60 aa）。<i>Alsophila spinulosa</i>（桫椤科，树蕨）：19 个位点，15 个为 Mitoviridae，16 个含完整 ORF。单一病毒类群主导 + 高比例完整 ORF，正是真实整合的特征，而非碎片化假阳性。<br><b>phiX174。</b>单一组装体（<i>Abies alba</i>）贡献了 55,737 个污染位点中的 55,725 个（占其自身判定的 94.1%）——属 Illumina 建库内参，已按基因组整体剔除；其余基因组各仅 1–3 个位点。<br><b>类病毒。</b>CEVd 样信号见于 1,374/1,526 个基因组（90%），但其中大部分落在 soft-mask 重复区，且跨远缘宿主 identity 不衰减——更符合重复元件特征而非内源化类病毒。CEVd 本身是否存在于植物基因组内，仍是<b>开放问题</b>，此处如实标注。'));
}

/* ---------- interactions ---------- */
function onChartClick(p) {
  var d = document.getElementById('detail');
  var html = '';
  if (S.view === 'virus' && p.componentSubType === 'bar' && p.dataIndex != null) {
    var taxa = vTaxa().filter(function (t) { return S.sub === 0 || (t.t !== 'phage' && t.t !== 'unclassified'); });
    var t = taxa.slice(0, S.sub === 0 ? 26 : 40).sort(function (a, b) { return a.l - b.l; })[p.dataIndex];
    if (t) html = detailTaxon(t);
  } else if (S.view === 'host' && p.componentSubType === 'bar' && p.dataIndex != null) {
    var key = ['l', 'g', 'rna', 'cauli'][S.sub];
    var arr = hFams().slice().sort(function (a, b) { return b[key] - a[key]; }).slice(0, S.topn).reverse();
    var h = arr[p.dataIndex];
    if (h) html = detailHost(h);
  }
  if (html) { d.innerHTML = html; d.classList.add('open'); }
}

function detailTaxon(t) {
  var tot = D.land.overview.loci;
  var rows = t.top.map(function (x) {
    return '<div class="linkrow"><span class="nm">' + x[0] + '</span><span class="v">' + fmt(x[1]) + '</span></div>';
  }).join('');
  return '<div class="dt">' + t.n + '</div>' +
    '<div class="sub">' + (VLAB[t.t] || t.t) + '</div>' +
    '<div class="kv"><div class="c"><b>' + fmt(t.l) + '</b><span>' + T('loci', '位点') + '</span></div>' +
    '<div class="c"><b>' + (100 * t.l / tot).toFixed(2) + '%</b><span>' + T('of all loci', '占全部位点') + '</span></div>' +
    '<div class="c"><b>' + fmt(t.g) + '</b><span>' + T('genomes', '基因组') + '</span></div>' +
    '<div class="c"><b>' + t.hf + '</b><span>' + T('host families', '宿主科') + '</span></div></div>' +
    '<h4>' + T('TOP HOST FAMILIES', '主要宿主科') + '</h4>' + rows;
}
function detailHost(h) {
  var maxv = h.vt.length ? h.vt[0][1] : 1;
  var rows = h.vt.map(function (x) {
    var w = Math.round(100 * x[1] / maxv);
    return '<div class="linkrow"><span class="nm">' + x[0] + '</span>' +
      '<span class="barwrap"><i style="width:' + w + '%;background:#2e86c1"></i></span>' +
      '<span class="v">' + fmt(x[1]) + '</span></div>';
  }).join('');
  return '<div class="dt">' + h.n + '</div>' +
    '<div class="sub">' + (GLAB[h.grp] || h.grp) + (h.ord ? ' · ' + h.ord : '') + '</div>' +
    '<div class="kv"><div class="c"><b>' + fmt(h.l) + '</b><span>' + T('loci', '位点') + '</span></div>' +
    '<div class="c"><b>' + fmt(h.g) + '</b><span>' + T('genomes', '基因组') + '</span></div>' +
    '<div class="c"><b>' + fmt(h.rna) + '</b><span>' + T('RNA EVE', 'RNA EVE') + '</span></div>' +
    '<div class="c"><b>' + fmt(h.cauli) + '</b><span>Caulimoviridae</span></div></div>' +
    '<h4>' + T('VIRUS FAMILIES', '病毒科构成') + '</h4>' + rows;
}

/* ---------- export ---------- */
function exportPng() {
  if (!CH) return;
  var url = CH.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#fff' });
  var a = document.createElement('a');
  a.href = url; a.download = 'eve_' + S.view + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function exportCsv() {
  var rows = [], name = 'eve_' + S.view + '.csv';
  if (S.view === 'virus') {
    rows.push(['viral_taxon', 'genome_type', 'loci', 'genomes', 'host_families']);
    vTaxa().forEach(function (t) { rows.push([t.n, t.t, t.l, t.g, t.hf]); });
  } else if (S.view === 'host') {
    rows.push(['host_family', 'plant_group', 'order', 'loci', 'genomes', 'rna_eve', 'caulimoviridae']);
    hFams().forEach(function (h) { rows.push([h.n, h.grp, h.ord, h.l, h.g, h.rna, h.cauli]); });
  } else if (S.view === 'dnarna') {
    rows.push(['genome_type', 'loci', 'genomes', 'families']);
    D.land.dna_rna.by_type.forEach(function (t) { rows.push([t.t, t.l, t.g, (t.f || []).join(';')]); });
  } else if (S.view === 'past') {
    rows.push(['host_family', 'quadrant', 'eve_loci', 'rna_eve', 'caulimoviridae', 'eve_genomes', 'extant_records']);
    D.dyn.past_present.forEach(function (r) { rows.push([r.n, r.q, r.eve, r.rna, r.cauli, r.g, r.ext]); });
  } else if (S.view === 'amp') {
    rows.push(['cluster_size_bin', 'n_clusters']);
    Object.keys(D.dyn.amplification.bins).forEach(function (k) { rows.push([k, D.dyn.amplification.bins[k]]); });
  } else if (S.view === 'tree') {
    rows.push(['metric', 'value']);
    rows.push(['tips', D.phy.n_leaves]);
    rows.push(['nearest_same_host_family', D.phy.tree_neighbor_same]);
    rows.push(['nearest_total', D.phy.tree_neighbor_total]);
    rows.push(['seq_nearest_ref_same_family', D.phy.nearest_ref_same_family]);
    rows.push(['seq_nearest_ref_total', D.phy.nearest_ref_same_family + D.phy.nearest_ref_diff_family]);
  } else {
    rows.push(['host_family', 'loci']);
    D.land.host_families.forEach(function (h) { rows.push([h.n, h.l]); });
  }
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
}
function resetAll() {
  S.offType = {}; S.offGroup = {}; S.sub = 0; S.topn = 20;
  document.getElementById('topn').value = '20';
  buildFilters();
  render();
}

  if (n == null) return '–';
  return Number(n).toLocaleString('en-US');
}

    for (const tr of N.vh) { const m = N.modes[tr[3]]; counts[m] = (counts[m] || 0) + 1; }
    fh += '<div class="hint" style="margin-bottom:3px">' + t('modesFilter') + '</div>';
    fh += '<div class="modegrid">' + N.modes.map(m =>
      '<label class="modechk" title="' + m.replace(/"/g, '&quot;') + '"><input type="checkbox" class="f-mode" value="' + m.replace(/"/g, '&quot;') + '"' +
      (st.modeFilter === null || st.modeFilter.has(m) ? ' checked' : '') + '><span>' + m + ' · ' + (counts[m] || 0) + '</span></label>'
    ).join('') + '</div>';
  }
  fh += '<div class="frow2">' +
        '<div class="c w"><div class="hint" style="margin:0 0 2px">' + t('minW') + '</div>' +
        '<input type="range" id="f-minw" min="1" max="' + (st.kind === 'vh' ? 30 : 12) + '" step="1" value="' + st.minW + '"></div>' +
        '<div class="c"><div class="hint" style="margin:0 0 2px">' + t('topN') + '</div>' +
        '<select id="f-topn">' + [100, 200, 300, 500, 0].map(v =>
          '<option value="' + v + '"' + (v === st.topN ? ' selected' : '') + '>' +
          (v === 0 ? t('all') : t('topNth').replace('{n}', v)) + '</option>').join('') + '</select></div></div>';
  fb.innerHTML = fh;

  /* 标签档位在 syncControls 里重建: 换语言时整个控件要被重画一遍, 所以 target 也在这里定死 */
  document.getElementById('labelctl').innerHTML =
    '<span class="k">' + t('labels') + '</span>' +
    '<select id="f-labels">' + [['top', t('topNth').replace('{n}', 70)], ['all', t('all')], ['none', t('none')]].map(o =>
      '<option value="' + o[0] + '"' + (o[0] === st.labels ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';

  document.getElementById('ly-rep').value = st.rep;
  document.getElementById('ly-edge').value = st.edge;

  const rv = document.getElementById('r-v'), rh = document.getElementById('r-h'), re = document.getElementById('r-e');
  if (rv) rv.addEventListener('change', e => { st.vRank = parseInt(e.target.value); aggregate(st); syncControls(st); render(); });
  if (rh) rh.addEventListener('change', e => { st.hRank = parseInt(e.target.value); aggregate(st); syncControls(st); render(); });
  if (re) re.addEventListener('change', e => { st.eRank = parseInt(e.target.value); aggregate(st); syncControls(st); render(); });
  const po = document.getElementById('f-plantonly');
  if (po) po.addEventListener('change', e => { st.plantOnly = e.target.checked; aggregate(st); render(); });
  document.querySelectorAll('.f-mode').forEach(cb => {
    cb.addEventListener('change', () => {
      const checked = [...document.querySelectorAll('.f-mode:checked')].map(x => x.value);
      st.modeFilter = checked.length === N.modes.length ? null : new Set(checked);
      aggregate(st);
      render();
    });
  });
  const mw = document.getElementById('f-minw');
  if (mw) mw.addEventListener('input', e => { st.minW = parseInt(e.target.value); render(); });
  const tn = document.getElementById('f-topn');
  if (tn) tn.addEventListener('change', e => { st.topN = parseInt(e.target.value); render(); });
  const lb = document.getElementById('f-labels');
  if (lb) lb.addEventListener('change', e => { st.labels = e.target.value; render(); });
  document.getElementById('ly-rep').oninput = e => { st.rep = parseInt(e.target.value); render(); };
  document.getElementById('ly-edge').oninput = e => { st.edge = parseInt(e.target.value); render(); };

  drawLegend(st);
}
function drawLegend(st) {
  // 节点色块交给画布左上角那个可点击的 ECharts 图例(点了能整侧隐藏), 这里只补充
  // 图例不会说的连线颜色与粗细含义, 不然同一份色键在屏上出现两遍。
  const el = document.getElementById('legend-top');
  const zh = lang() === 'zh';
  const SEP = '<span class="sep"></span>';
  let html;
  if (st.kind === 'vh') {
    html = '<span class="it"><span class="ln" style="border-color:#c3ced9"></span>' +
           (zh ? '连线' : 'link') + '</span>' + SEP +
           '<span class="it note">' + (zh ? '粗细 = 关联强度' : 'width = association strength') + '</span>' + SEP +
           '<span class="it note">' + (zh ? '节点大小 = 序列条数' : 'node size = accession count') + '</span>';
  } else {
    html = '<span class="it"><span class="ln" style="border-color:#9fc5a9"></span>' +
           (zh ? '病毒–宿主' : 'virus–host') + '</span>' +
           '<span class="it"><span class="ln" style="border-color:#aeb8dd"></span>' +
           (zh ? '病毒–媒介' : 'virus–vector') + '</span>' + SEP +
           '<span class="it note">' + (zh ? '粗细 = 三元组数' : 'width = triplet count') + '</span>' + SEP +
           '<span class="it note">' + (zh
             ? '另 120 条仅验证病毒–媒介关系，只画媒介连线'
             : '120 records are virus–vector only') + '</span>';
  }
  el.innerHTML = html;
}

/* ── stats / footer ── */
function fillStats() {
  const bar = document.getElementById('statbar');
  if (currentTab === 'vh') {
    const s = A.meta.stats;
    bar.innerHTML =
      '<span class="chip"><b>' + s.sequences.toLocaleString() + '</b> ' + t('seqChip') + '</span>' +
      '<span class="chip"><b>' + s.virus_species.toLocaleString() + '</b> ' + t('virusSpChip') + '</span>' +
      '<span class="chip"><b>' + s.plant_host_leaves.toLocaleString() + '</b> ' + t('hostTaxaChip') + '</span>' +
      '<span class="chip"><b>' + s.pairs.toLocaleString() + '</b> ' + t('pairChip') + '</span>';
  } else {
    const s = N.meta.stats;
    bar.innerHTML =
      '<span class="chip"><b>' + s.vh_triplets.toLocaleString() + '</b> ' + t('tripletChip') + '</span>' +
      '<span class="chip"><b>' + s.vh_viruses.toLocaleString() + '</b> ' + t('virusChip') + '</span>' +
      '<span class="chip"><b>' + s.vh_vectors.toLocaleString() + '</b> ' + t('vectorChip') + '</span>' +
      '<span class="chip"><b>' + s.vh_hosts.toLocaleString() + '</b> ' + t('hostChip') + '</span>';
  }
}
function fillFooter() {
  document.getElementById('ft-text').textContent = lang() === 'zh'
    ? 'Tab 1：Plant_Virus_Full 数据库中 211,132 条 GenBank 序列的病毒–宿主共现网络，宿主谱系经 NCBI Taxonomy 解析；计数为序列条数，不等同于文献证实的宿主范围。Tab 2：VIP-DB 实验验证的病毒–媒介–宿主三元组（含传毒机制与 DOI），宿主谱系经 NCBI taxdump 解析；其中 120 条仅验证病毒–媒介关系。'
    : 'Tab 1: virus–host co-occurrence network over 211,132 GenBank accessions of the Plant_Virus_Full database; host lineages resolved via NCBI Taxonomy — counts are sequence numbers, not literature-confirmed host ranges. Tab 2: VIP-DB experimentally validated virus–vector–host triplets with transmission modes and DOIs (host lineages via NCBI taxdump); 120 of them are virus–vector relationships only.';
  document.getElementById('ft-meta').textContent = 'build ' +
    (currentTab === 'vh' ? A.meta.generated : N.meta.generated) + ' · ' + N.meta.sources;
}

/* ── tab switching ── */
function switchTab(kind) {
  currentTab = kind;
  document.getElementById('tab-vh').classList.toggle('on', kind === 'vh');
  document.getElementById('tab-evh').classList.toggle('on', kind === 'evh');
  const st = tab();
  if (!st.full) aggregate(st);
  syncControls(st);
  fillStats();
  fillFooter();
  render();
  // hash 深链：#tvh 直接落在媒介–病毒–宿主标签页（外链或嵌进外壳时用）。
  // replaceState 不堆历史记录，嵌在 iframe 里也不会劫持外层页面的后退键；
  // 没带 hash 的访问行为与从前完全一致。历史被禁用（个别 webview）时静默跳过。
  try {
    const want = kind === 'evh' ? '#tvh' : '';
    if (location.hash !== want) {
      history.replaceState(null, '', location.pathname + location.search + want);
    }
  } catch (e) { /* noop */ }
}

/* ── boot ── */
/* 输入框内容宽只有 ~234px, 长了会被硬切而且 input 不出省略号(实测中文版超宽 46px、英文 62px,
   屏幕上看只剩"…如 TSWV、Bemisi")。例子交给下面那行 hint, 占位符只留"搜什么"。 */
function searchPlaceholder() {
  return lang() === 'zh' ? '搜索病毒 / 媒介 / 宿主…'
                         : 'Search virus / vector / host…';
}
function initUI() {
  chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  window.__dbg = {chart: () => chart, TABS, A: () => A, N: () => N, cur: () => currentTab, view: () => tab().view, st: () => tab(), fit: () => fitSettling};
  bindChartEvents();

  document.getElementById('btn-png').addEventListener('click', exportPNG);
  document.getElementById('btn-csv').addEventListener('click', exportCSV);
  document.getElementById('btn-reset').addEventListener('click', () => {
    const kind = currentTab;
    TABS[kind] = freshTab(kind);
    syncControls(TABS[kind]);
    render();
  });
  document.getElementById('tab-vh').addEventListener('click', () => switchTab('vh'));
  document.getElementById('tab-evh').addEventListener('click', () => switchTab('evh'));

  const inp = document.getElementById('search');
  const drop = document.getElementById('searchdrop');
  let deb = null;
  const searchNow = () => { const q = inp.value.trim(); if (q) runSearch(q); else drop.style.display = 'none'; };
  inp.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(searchNow, 180); });
  inp.addEventListener('focus', () => { if (inp.value.trim()) searchNow(); });
  inp.setAttribute('placeholder', searchPlaceholder());
  document.addEventListener('click', (e) => { if (!e.target.closest('.searchwrap')) drop.style.display = 'none'; });
  // 下拉是 fixed 定位的, 页面一滚位置就飘, 得跟着输入框走(捕获段: 侧栏自己滚也要听)
  window.addEventListener('scroll', placeDrop, true);
  window.addEventListener('resize', placeDrop);
  // 容器变宽(侧栏折叠、窗口拖动)不一定会触发 window resize。ResizeObserver 是正路,
  // 但嵌入式 webview 里它的回调可能始终不触发, 所以再用一个低频轮询兜底: 只要容器尺寸
  // 变了就同步画布, 宽高比变了不少且用户没手动拖过视图时重新自适应一次。
  const chartHost = document.getElementById('chart');
  window.addEventListener('resize', () => { syncChartSize(); chart && chart.resize(); });
  if (window.ResizeObserver && chartHost) {
    new ResizeObserver(() => onHostResized()).observe(chartHost);
  }
  setInterval(onHostResized, 400);

  // language sync (i18n button id varies by i18n.js version)
  let lastLang = lang();
  setInterval(() => {
    if (lang() !== lastLang) {
      lastLang = lang();
      inp.setAttribute('placeholder', searchPlaceholder());
      syncControls(tab());
      fillStats();
      fillFooter();
      render();
    }
  }, 400);
  document.addEventListener('click', (e) => {
    const id = e.target.id || '';
    if (id === 'pvdb-i18n-btn' || id === 'pvdb-lang-btn') {
      setTimeout(() => {
        inp.setAttribute('placeholder', searchPlaceholder());
        syncControls(tab());
        fillStats();
        fillFooter();
        render();
      }, 80);
    }
  }, true);
}

/* ── 启动 ── */
Promise.all([
  fetch('../association/associations.json').then(r => { if (!r.ok) throw new Error('associations.json ' + r.status); return r.json(); }),
  fetch('network.json').then(r => { if (!r.ok) throw new Error('network.json ' + r.status); return r.json(); })
]).then(([a, n]) => {
  A = a; N = n;
  buildIndexes1();
  VLINK = new Set(n.vlink);
  ELINK = new Set(n.elink || []);
  // alias1/alias2 在 JSON 里是普通对象 {别名: 规范名}，转 Map 才能用 has/get
  ALIAS1 = new Map(Object.entries(n.alias1 || {}));
  ALIAS2 = new Map(Object.entries(n.alias2 || {}));
  buildGenusIndex();
  buildRankIndex();
  initUI();
  fillStats();
  fillFooter();
  // 带 #tvh 进来的（书签、外壳 iframe）落在第二个标签页，其余不变
  switchTab(location.hash === '#tvh' ? 'evh' : 'vh');
  // hash 是 switchTab 自己写的，后退/前进到另一个 hash 时也得跟上，
  // 否则同文档跳转（不重载）只会换地址栏、标签页不动
  window.addEventListener('hashchange', () => switchTab(location.hash === '#tvh' ? 'evh' : 'vh'));
}).catch(err => {
  document.getElementById('chart').innerHTML =
    '<div class="loading" style="color:#c0392b">Failed to load data — ' + err.message + '</div>';
});
</script>

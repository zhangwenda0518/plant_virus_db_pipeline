<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物病毒蛋白 3D 结构 | RVPSD 子集</title>
<script src="./vendor/3Dmol-min.js"></script>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --line: #dde3ea;
    --ink: #1f2d3d; --muted: #7a8699; --accent: #2b6cb0; --accent-soft: #e8f0fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }

  header { background: #16324f; color: #fff; padding: 10px 20px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .stat { font-size: 12px; color: #b8c9db; }
  header .src { font-size: 11px; color: #8fa8c0; margin-left: auto; }
  header .src a { color: #b8d4f0; }

  #layout { flex: 1; display: flex; min-height: 0; }

  /* ---- sidebar ---- */
  #side { width: 320px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #searchBox { padding: 10px; border-bottom: 1px solid var(--line); }
  #search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #spList { flex: 1; overflow-y: auto; }
  .spItem { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f0f3f7; }
  .spItem:hover { background: var(--accent-soft); }
  .spItem.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .spItem .nm { font-size: 13px; font-weight: 600; }
  .spItem .meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; }
  .spItem .cnt { background: #e4ebf3; color: #4a6b8f; border-radius: 8px; padding: 0 6px; font-size: 10px; }

  /* ---- main ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #toolbar label { font-size: 12px; color: var(--muted); }
  #protSel { max-width: 480px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; background: #fff; }
  #infoLine { font-size: 12px; color: var(--muted); }
  #infoLine b { color: var(--ink); }
  #infoLine .plddt-hi { color: #157a3a; font-weight: 600; }
  #infoLine .plddt-mid { color: #b8860b; font-weight: 600; }
  #infoLine .plddt-lo { color: #b03a2e; font-weight: 600; }

  #viewer { flex: 1; position: relative; min-height: 0; background: #f0f2f5; }
  #viewer .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  #afLegend { position: absolute; left: 10px; top: 8px; z-index: 5; background: rgba(255,255,255,.92);
              border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; display: flex; align-items: center; }

  #note { padding: 6px 14px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
  #note a { color: var(--accent); }
</style>
</head>
<body>
<script src="/lib/site-nav.js?v=2"></script>
<header>
  <h1>植物病毒蛋白 3D 结构</h1>
  <span class="stat" id="statLine"></span>
  <span class="src">结构来源：<a href="https://doi.org/10.1002/imo2.70120" target="_blank">RVPSD (Yang et al., iMetaOmics 2026)</a>，AlphaFold2 预测，CC-BY 4.0（全原子优先 / CA-trace 兜底）</span>
</header>

<div id="layout">
  <div id="side">
    <div id="searchBox"><input id="search" placeholder="搜索物种 / 科名（中文或拉丁名）…" autocomplete="off"></div>
    <div id="spList"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <label>蛋白：</label>
      <select id="protSel" disabled><option>请先选择物种</option></select>
      <span id="infoLine">左侧选择一个物种开始浏览</span>
    </div>
    <div id="viewer"><div class="placeholder">未加载结构</div></div>
  </div>
</div>

<div id="note">
  结构说明：全原子模型（cartoon 渲染，B-factor = 逐残基 pLDDT）优先；缺全原子的蛋白回退 CA-trace 骨架（小球+连线）。
  鼠标拖拽旋转 / 滚轮缩放。
  数据：<a href="https://doi.org/10.1002/imo2.70120" target="_blank">Yang et al. 2026, iMetaOmics e70120</a> · CC-BY 4.0 · 查看器 <a href="https://github.com/3dmol/3Dmol.js" target="_blank">3Dmol.js (BSD)</a>
</div>

<script src="./vendor/3Dmol-min.js"></script>
<script>
const DATA_URL = './data/structures_index.json';
const PDB_FA_BASE = './structures_fullatom/';
const PDB_CA_BASE = './structures/';
let INDEX = null, glviewer = null, current = null, FA_MAP = null;

const $ = (s) => document.querySelector(s);
const plddtCls = (v) => v == null ? '' : (v >= 85 ? 'plddt-hi' : v >= 70 ? 'plddt-mid' : 'plddt-lo');

// ---- AlphaFold pLDDT 四色（复现 RVPSD alphafoldView 配色）----
const AF_COLORS = { b90: '#0053d6', b70: '#65cbf3', b50: '#ffdb13', b00: '#ff7d45' };
const AF_LABELS = { b90: '很棒 ≥90', b70: '良好 70–90', b50: '一般 50–70', b00: '差 < 50' };

function bucketByPlddt(viewer) {
  const seen = new Set(), buckets = {};
  for (const a of viewer.selectedAtoms({})) {
    const key = (a.chain || '') + ':' + a.resi;
    if (seen.has(key)) continue;
    seen.add(key);
    const b = +a.b || 0;
    const name = b >= 90 ? 'b90' : b >= 70 ? 'b70' : b >= 50 ? 'b50' : 'b00';
    (buckets[name] = buckets[name] || []).push(a.resi);
  }
  return { buckets, colors: AF_COLORS };
}

function spectrumHex(t) {
  const h = Math.round(240 - 240 * Math.min(Math.max(t, 0), 1));
  const f = (n) => {
    const k = (n + h / 60) % 6;
    const v = 1 - Math.max(0, Math.min(k, 4 - k, 1));
    return Math.round(255 * v).toString(16).padStart(2, '0');
  };
  return '#' + f(5) + f(3) + f(1);
}

function showLegend(applied) {
  let lg = document.getElementById('afLegend');
  if (!lg) {
    lg = document.createElement('div');
    lg.id = 'afLegend';
    $('#viewer').appendChild(lg);
  }
  lg.style.display = 'flex';
  lg.innerHTML = '<span style="margin-right:6px;color:#7a8699">pLDDT:</span>' +
    Object.entries(AF_COLORS).map(([k, c]) =>
      `<span style="display:inline-flex;align-items:center;margin-right:8px">
         <i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:3px"></i>
         <span style="font-size:10.5px;color:${applied.has(k) ? '#1f2d3d' : '#c3cad3'}">${AF_LABELS[k]}</span>
       </span>`).join('');
}

function hideLegend() {
  const lg = document.getElementById('afLegend');
  if (lg) lg.style.display = 'none';
}

async function initViewer(container, p) {
  container.innerHTML = '<div class="placeholder">结构加载中…</div>';
  try {
    const fas = encodeURIComponent(p.fas) + '.pdb';
    let text = null, mode = null;
    if (FA_MAP === null) {
      try { FA_MAP = await (await fetch('./data/fullatom_map.json')).json(); }
      catch (e) { FA_MAP = {}; }
    }
    const faDir = FA_MAP && FA_MAP[p.fas];
    if (faDir) {
      const r = await fetch('./' + faDir + '/' + fas);
      if (r.ok) { text = await r.text(); mode = '全原子'; }
    }
    if (!text) {
      const r = await fetch(PDB_CA_BASE + fas);
      if (r.ok) { text = await r.text(); mode = 'CA-trace'; }
    }
    if (!text) throw new Error('该蛋白暂无结构文件');
    container.innerHTML = '';
    glviewer = $3Dmol.createViewer(container, { backgroundColor: '#f0f2f5' });
    glviewer.addModel(text, 'pdb');
    if (mode === '全原子') {
      // 完整主链 + 侧链：cartoon + AlphaFold pLDDT 四色着色（复现 RVPSD alphafoldView）
      const { buckets, colors } = bucketByPlddt(glviewer);
      const applied = new Set();
      for (const [k, resis] of Object.entries(buckets)) {
        if (!resis.length) continue;
        glviewer.setStyle({ resi: resis },
          { cartoon: { color: colors[k], arrows: false } });
        applied.add(k);
      }
      showLegend(applied);
    } else {
      // CA-trace：α-碳小球 + 相邻残基连线，沿序列 spectrum 渐变（蓝→红 = N→C）
      const xyz = glviewer.selectedAtoms({}).map(a => [a.x, a.y, a.z]);
      const n = Math.max(xyz.length - 1, 1);
      glviewer.addStyle({ atom: 'CA' },
        { sphere: { radius: 0.55, colorscheme: 'spectrum' } });
      for (let i = 0; i + 1 < xyz.length; i++) {
        glviewer.addLine({
          start: { x: xyz[i][0], y: xyz[i][1], z: xyz[i][2] },
          end: { x: xyz[i + 1][0], y: xyz[i + 1][1], z: xyz[i + 1][2] },
          style: { color: spectrumHex(i / n), width: 2 }
        });
      }
      hideLegend();
    }
    glviewer.zoomTo();
    glviewer.render();
    return mode;
  } catch (err) {
    container.innerHTML = '<div class="placeholder">结构加载失败：' +
      String(err && err.message || err) + '</div>';
    return null;
  }
}

function selectSpecies(sp) {
  current = sp;
  document.querySelectorAll('.spItem').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.spItem[data-nm="${CSS.escape(sp.name)}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }

  const sel = $('#protSel');
  sel.innerHTML = '';
  const sorted = [...sp.proteins].sort((a, b) => (b.plddt ?? -1) - (a.plddt ?? -1));
  for (const p of sorted) {
    const o = document.createElement('option');
    o.value = p.fas;
    o.textContent = `${p.acc} · ${p.product} · pLDDT ${p.plddt ?? '—'}`;
    sel.appendChild(o);
  }
  sel.disabled = false;
  loadProtein(sorted[0]);
}

async function loadProtein(p) {
  if (!p) return;
  const cls = plddtCls(p.plddt);
  const ncbi = p.acc ? ` · <a href="https://www.ncbi.nlm.nih.gov/protein/${p.acc}" target="_blank">NCBI ${p.acc}</a>` : '';
  $('#infoLine').innerHTML =
    `<b>${current.name}</b> — ${p.product}${ncbi} · ` +
    `平均 pLDDT: <span class="${cls}">${p.plddt ?? '无记录'}</span>` +
    (p.host ? ` · 宿主: ${p.host.replace(/_/g, ' ')}` : '') +
    ' · <span id="modeLine">加载中…</span>';
  const mode = await initViewer($('#viewer'), p);
  const ml = document.getElementById('modeLine');
  if (ml) ml.textContent = mode ? `结构: ${mode}` : '';
}

function renderList(keyword) {
  const list = $('#spList');
  list.innerHTML = '';
  const kw = (keyword || '').trim().toLowerCase();
  const items = INDEX.species.filter(sp =>
    !kw || sp.name.toLowerCase().includes(kw) || sp.family.toLowerCase().includes(kw) ||
    (sp.abbrev || '').toLowerCase().includes(kw));
  const frag = document.createDocumentFragment();
  for (const sp of items.slice(0, 400)) {
    const d = document.createElement('div');
    d.className = 'spItem' + (current && current.name === sp.name ? ' active' : '');
    d.dataset.nm = sp.name;
    d.innerHTML = `<div class="nm">${sp.name}</div>
      <div class="meta"><span>${sp.family || '—'}</span><span class="cnt">${sp.count} 蛋白</span></div>`;
    d.addEventListener('click', () => selectSpecies(sp));
    frag.appendChild(d);
  }
  if (!items.length) list.innerHTML = '<div style="padding:14px;font-size:12px;color:#7a8699">无匹配物种</div>';
  list.appendChild(frag);
}

fetch(DATA_URL).then(r => r.json()).then(idx => {
  INDEX = idx;
  $('#statLine').textContent = `${idx.count_species} 个植物病毒种 · ${idx.count_proteins} 个蛋白结构`;
  renderList('');
  $('#search').addEventListener('input', (e) => renderList(e.target.value));
  $('#protSel').addEventListener('change', (e) => {
    const p = current.proteins.find(x => x.fas === e.target.value);
    loadProtein(p);
  });
});
</script>
<script src="/lib/ai-assistant.js?v=2" data-context="structures" defer></script>
</body>
</html>

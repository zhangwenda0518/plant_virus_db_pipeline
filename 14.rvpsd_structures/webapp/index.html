<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title data-i18n="Protein Structure — Plant Virus DB|蛋白结构 — 植物病毒数据库">Protein Structure — Plant Virus DB</title>
<meta name="description" content="One entry point for every plant-virus protein structure view: the UniProt Structure Atlas (coverage reconciliation over 4,810 proteins, with per-species completeness and pending-prediction gap tiers) and the RVPSD + vpSAT + AlphaFoldDB 3D model browser (2,603 species / 20,950 full-atom models, Molstar viewer). UniProt 结构对账与 RVPSD 3D 模型浏览器的统一入口。">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f4f6f8;color:#2c3e50;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── top bar：品牌 / 视图切换 / 操作区，收成一行 ──
 * 2026-10-08 单页化：原来这里是「顶栏 chips + 描述行 + 视图卡片条」三条独立的栏，
 * 其中 chips 与描述行都在复述子页自己的读数与文案 → 一并删掉，只留「切视图」这件事。 */
nav.topbar{background:linear-gradient(135deg,#134e6f 0%,#1a5276 55%,#2e86c1 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap;flex:none}
nav.topbar .brand{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
nav.topbar .brand a{color:#fff;text-decoration:none}
nav.topbar .sep{opacity:.35}
nav.topbar .subtitle{font-size:12.5px;opacity:.92;font-weight:600;white-space:nowrap}

/* ── view switcher：做成深色栏上的胶囊按钮，不再单占一行 ── */
.tabs{display:flex;gap:6px;margin-left:6px}
.tabs button.vtab{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.24);border-radius:9px;color:#fff;padding:5px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.tabs button.vtab:hover{background:rgba(255,255,255,.20)}
.tabs button.vtab.on{background:#fff;color:#1a5276;border-color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ── acts：语言切换 + 新窗口打开，右对齐 ── */
.acts{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
button.act{background:#fff;border:1px solid #dceaf3;border-radius:9px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#1a5276;cursor:pointer;transition:.15s;white-space:nowrap}
button.act:hover{background:#e3f0f9;border-color:#bcd8e8;color:#2e86c1}
/* 语言按钮：i18n.js 默认往 body 末尾塞一颗 fixed 在左下角的 44px 圆按钮，在外壳里
   正好压在 iframe 的内容上（/relations/ 实测三个宽度各压住 1936 px²）→ 收进 .acts
   跟"新窗口打开"并排，iframe 内那颗 display:none。 */
button.act.langtab{min-width:54px;padding:5px 10px;text-align:center}

/* ── stage: one iframe at a time (plus the previous one, kept warm) ──
 * ⚠ 高度**刻意定死**（与 /relations/ 的「随内容撑高」相反，理由见页内注释）：
 *   ① RVPSD 查看器自身是 height:100vh 的应用，撑高会与 iframe 视口自指成反馈环；
 *   ② Atlas 的蛋白详情面板是 position:fixed —— 撑高后它会被钉在 iframe 顶部，
 *      点表格下半部的行时面板出现在屏幕外。
 *   所以这里给一个视口高度，两个子应用各自在框内滚动（它们本来就是这么设计的）。 */
.stage{flex:1 1 auto;min-height:0;position:relative;margin:10px 16px 8px;background:#fff;border:1px solid #eef2f5;border-radius:14px;box-shadow:0 2px 10px rgba(20,60,90,.06);overflow:hidden}
.stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block;background:#fff}
.mask{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#f4f6f8;color:#7b8a99;font-size:13px;z-index:5}
.mask .spinner{width:26px;height:26px;border:3px solid #dceaf3;border-top-color:#2e86c1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{padding:0 16px 10px;width:100%;max-width:1760px;margin:0 auto;font-size:11.5px;color:#9aa7b4;line-height:1.7;flex:none}
.foot a{color:#2e86c1;text-decoration:none}
.foot a:hover{text-decoration:underline}

/* 窄屏：副标题收起、切换器折行 */
@media(max-width:900px){
  nav.topbar .subtitle,nav.topbar .sep{display:none}
  .tabs{flex-wrap:wrap;margin-left:0}
}
@media(max-height:560px){.foot{display:none}}
</style>
</head>
<body>
<script src="/lib/site-nav.js?v=2"></script>

<nav class="topbar">  <div class="subtitle" data-i18n="Protein Structure|蛋白结构">Protein Structure</div>
  <div class="tabs" id="strip"></div>
  <div class="acts">
    <button class="act" id="btn-open" data-i18n="&#10530; Open in new tab|&#10530; 在新标签打开">&#10530; Open in new tab</button>
  </div>
</nav>

<div class="stage" id="stage">
  <div class="mask" id="mask"><div class="spinner"></div><span id="mask-text">Loading…</span></div>
</div>

<div class="foot" id="vfoot"></div>

<script src="/i18n.js"></script>
<script>
'use strict';
/* ================================================================
 * 蛋白结构总入口：把原先分散的页面嵌在同一个外壳里
 *   #atlas     atlas/        UniProt Structure Atlas —— 覆盖对账 + 完整率/缺口 + 蛋白检索
 *                            + 病毒级覆盖 + 管线台账，全在一页，页内用锚点条定位
 *   #browse    rvpsd.html    RVPSD + AlphaFold2 全原子模型浏览器（PDBe Molstar 完整版）
 *
 * 2026-10-08 单页化（老师反馈「Statistics panel / Coverage atlas 保留一个就行，乱得很」）：
 *   原三标签里的前两个是同一模块的两页，指标卡 8 张里 7 张逐字相同 → 把 stats.html 的四节
 *   并入 atlas 的 index.html，删掉 stats.html（旧 URL 301 到 atlas/）。外壳因此只剩两个
 *   标签，且只做「切视图」一件事：顶栏不再复述子页的读数（chips）与文案（描述行），
 *   那两行是当时「乱」的主要来源。
 *
 * 两个设计点：
 * 1) 外层只做壳：子页面自身逻辑零改动（rvpsd.html 只是原 index.html 改名，相对路径
 *    同级不变；atlas/ 由 nginx alias 直挂模块 15 的 webapp，不复制文件）。
 *    外壳只往 iframe 里注入一条样式 —— 藏掉子页自己那颗浮动语言按钮（语言统一由外壳
 *    .acts 里那颗切，localStorage 同源共享）。
 *    ⚠ 子页自己的 body>header **不再藏**：rvpsd.html 的 header 是应用工具条；
 *      atlas 的 header 现在是「页名 + 页内锚点条」，正是本页需要的第二层定位。
 * 2) ⚠ 高度**定死**，与 /relations/ 的「随内容撑高」相反。原因见 CSS 里 .stage 的注释：
 *    RVPSD 查看器自身 height:100vh（撑高会与 iframe 视口自指成反馈环），
 *    Atlas 的蛋白详情面板是 position:fixed（撑高后会被钉在 iframe 顶部、点下半部
 *    的行时面板跑到屏幕外）。所以两个子应用各自在框内滚动。
 *    如果以后要改回「整页滚」，必须先解决上面这两条。
 * ================================================================ */

var VIEWS = {
  atlas: {
    url: 'atlas/',
    open: 'atlas/',
    t: {en: 'Coverage atlas', zh: '结构总览'}
  },
  browse: {
    url: 'rvpsd.html',
    open: 'rvpsd.html',
    t: {en: '3D structure library', zh: '3D 结构库'}
  }
};
var ORDER = ['atlas', 'browse'];
var DEFAULT_KEY = 'atlas';

/* 旧深链兼容：/structures3d/#stats 是单页化之前「统计面板」的地址，该页已并入 atlas，
   所以落到 atlas 视图并滚到「缺口与完整率」那一节。hash 也支持 `#atlas/gap` 复合形式。 */
var ALIAS = { stats: ['atlas', 'gap'] };

/* data-i18n 只能放纯文本（i18n.js 用 textContent 覆盖，标签会被当字面量显示），
   所以带链接的页脚在这里按语言渲染。 */
var FOOT = {
  en: 'Two views, two modules: the Atlas is <code>15.uniprot_plant_virus_structures/webapp/</code> (module 15, UniProt release <b>2026_03</b>; coverage reconciliation, per-species completeness and pending-prediction gap tiers on one page), and the model browser is <a href="rvpsd.html">rvpsd.html</a> (module 14, RVPSD Yang et al. 2026, CC-BY 4.0). Viewer: <a href="https://github.com/PDBeurope/pdbe-molstar" target="_blank">PDBe Molstar 3.11.0</a> (Apache-2.0) / <a href="https://github.com/3dmol/3Dmol.js" target="_blank">3Dmol.js</a> (BSD).',
  zh: '两个视图来自两个模块：Atlas 在 <code>15.uniprot_plant_virus_structures/webapp/</code>（模块 15，UniProt 版本 <b>2026_03</b>；覆盖对账、物种级完整率、待预测缺口分层合并为一页），模型浏览器是 <a href="rvpsd.html">rvpsd.html</a>（模块 14，RVPSD Yang et al. 2026，CC-BY 4.0）。查看器：<a href="https://github.com/PDBeurope/pdbe-molstar" target="_blank">PDBe Molstar 3.11.0</a>（Apache-2.0）／<a href="https://github.com/3dmol/3Dmol.js" target="_blank">3Dmol.js</a>（BSD）。'
};

var stage = document.getElementById('stage');
var mask = document.getElementById('mask');
var maskText = document.getElementById('mask-text');
var strip = document.getElementById('strip');
var current = null;
var live = {};        // key -> iframe（最多 2 个）
var recent = [];      // 挂载顺序，最后一个就是 current
var wantSec = {};     // key -> 载入后要滚到的页内锚点
var maskTimer = null;

function lang() {
  try { if (window.PVDB_i18n && PVDB_i18n.lang) return PVDB_i18n.lang(); } catch (e) { /* noop */ }
  return localStorage.getItem('pvdb_lang') || 'en';
}

/* i18n.js 给每一页都注入一颗 fixed 左下角的语言按钮。外壳里这一颗会压在 iframe 的
   内容上，iframe 里各自那一颗又跟它重复 —— 所以：外壳的收进 .acts 改成普通按钮，
   整页只剩这一个；iframe 里那一颗由 muteInnerChrome 藏掉。 */
var acts = document.querySelector('.acts');
function adoptLangBtn() {
  var b = document.getElementById('pvdb-lang-btn') || document.getElementById('pvdb-i18n-btn');
  if (!b || b.dataset.adopted || !acts) return false;
  b.dataset.adopted = '1';
  b.removeAttribute('style');          // 去掉 fixed/left/bottom，位置改由 .acts 排
  b.className = 'act langtab';
  b.type = 'button';
  var orig = b.onclick;
  b.onclick = function (ev) {
    if (orig) { try { orig.call(this, ev); } catch (e) { /* noop */ } }
    repaintForLang();                  // 外壳自己这颗按钮点完同步重绘，不等 400ms 轮询
    return false;
  };
  acts.appendChild(b);                 // ⚠ 必须真的搬进 .acts，只去 style 会被 flex 拉成整行
  return true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', adoptLangBtn);
else adoptLangBtn();
setTimeout(adoptLangBtn, 80);          // i18n 注入晚一拍时的兜底
setTimeout(adoptLangBtn, 600);

/* 嵌进来的页面自带一颗 floating 语言按钮（在它自己文档左下角）—— 语言统一由外壳
   .acts 里那颗切（localStorage 同源共享），所以藏掉即可。
   ⚠ 子页的 body>header **不藏**：
      · rvpsd.html 的 header 是应用自己的工具条（物种/蛋白读数 + 来源署名），不是导航；
      · atlas 的 header 现在是「页名 + 页内锚点条」，正是本页需要的第二层定位
        （2026-10-08 单页化之前它是「总览｜统计面板｜预测平台 ↗」那条与外壳重复的
        导航，所以当时藏掉；换成锚点条之后藏了反而丢掉页内导航）。
   load 之后才注样式 —— 按钮是各页 DOMContentLoaded 时才建的。 */
function muteInnerChrome(f) {
  try {
    var d = f.contentDocument;
    if (!d || d.getElementById('pvdb-hub-chrome-mute')) return;
    var s = d.createElement('style');
    s.id = 'pvdb-hub-chrome-mute';
    s.textContent = '#pvdb-lang-btn,#pvdb-i18n-btn{display:none!important}' +
                    /* 2026-10-13: 子页也注入了全站导航(#pvdb-nav)，外壳顶栏已有 →
                       内嵌时藏掉；子页单独打开时不受影响 */
                    '#pvdb-nav{display:none!important}';
    (d.head || d.documentElement).appendChild(s);
  } catch (e) { /* 跨域或还没就绪，跳过 */ }
}

function paintStrip() {
  var zh = lang() === 'zh';
  strip.innerHTML = '';
  ORDER.forEach(function (k) {
    var v = VIEWS[k];
    var b = document.createElement('button');
    b.className = 'vtab' + (k === current ? ' on' : '');
    b.type = 'button';
    b.dataset.view = k;
    b.setAttribute('aria-pressed', k === current ? 'true' : 'false');
    b.textContent = zh ? v.t.zh : v.t.en;
    b.addEventListener('click', function () { show(k, true); });
    strip.appendChild(b);
  });
}

/* 两个视图各是一个子页面 —— 各自有独立的 document.title，这样把 #browse 分享出去、
   或者收藏成书签，标签页上写的是「3D model browser」而不是笼统的总标题。
   注意 <title> 也带 data-i18n，i18n.js 的 apply() 会 textContent 覆盖它，
   所以这里必须**连属性一起改写**，否则切语言时标题会被打回固定值。 */
function paintTitle() {
  var v = VIEWS[current];
  var zh = lang() === 'zh';
  var t = document.querySelector('title');
  if (!t) return;
  var EN = ' · Protein Structure — Plant Virus DB', ZH = ' · 蛋白结构 — 植物病毒数据库';
  t.setAttribute('data-i18n', v.t.en + EN + '|' + v.t.zh + ZH);
  document.title = (zh ? v.t.zh : v.t.en) + (zh ? ZH : EN);
}

function paintFoot() {
  document.getElementById('vfoot').innerHTML = FOOT[lang() === 'zh' ? 'zh' : 'en'];
}

/* hash → {key, sec}：支持 #atlas、#browse、#atlas/gap（复合），以及旧深链 #stats。
   未知 key（例如早已摘除的 #pipeline）优雅回落默认视图，不白屏。 */
function parseHash() {
  var h = (location.hash || '').replace(/^#/, '');
  var parts = h.split('/');
  var k = parts[0] || '', sec = parts[1] || null;
  if (!VIEWS[k]) {
    var al = ALIAS[k];
    if (al) { k = al[0]; sec = sec || al[1]; }
    else return { key: DEFAULT_KEY, sec: null };
  }
  return { key: k, sec: sec };
}

/* 页内锚点：iframe 载入后把它的 location.hash 设成目标小节（同文档导航，不触发重载）。 */
function applySection(key) {
  var sec = wantSec[key];
  if (!sec) return;
  delete wantSec[key];
  try { live[key].contentWindow.location.hash = sec; } catch (e) { /* noop */ }
}

function show(key, push, sec) {
  if (!VIEWS[key]) key = DEFAULT_KEY;
  current = key;
  if (sec) wantSec[key] = sec;

  // hide every warm frame except the one we want.
  // 只切 visibility，不切 display：rvpsd.html 的 Molstar 画在 WebGL canvas 上，
  // display:none 子树里的 canvas 后备存储会被浏览器丢掉，切回来就白了。
  Object.keys(live).forEach(function (k) {
    live[k].style.visibility = (k === key) ? 'visible' : 'hidden';
  });

  if (!live[key]) {
    var f = document.createElement('iframe');
    f.src = VIEWS[key].url;
    f.title = VIEWS[key].t[lang() === 'zh' ? 'zh' : 'en'];
    f.setAttribute('allow', 'fullscreen');
    f.addEventListener('load', function () {
      clearTimeout(maskTimer);
      if (current === key) mask.style.display = 'none';
      muteInnerChrome(f);
      applySection(key);
    });
    stage.appendChild(f);
    live[key] = f;
    /* mask 撑到 load 为止；load 迟迟不来（请求挂死）也不能把人困在遮罩后面 */
    maskText.textContent = (lang() === 'zh' ? '正在加载 ' : 'Loading ') +
      VIEWS[key].t[lang() === 'zh' ? 'zh' : 'en'] + '…';
    mask.style.display = 'flex';
    clearTimeout(maskTimer);
    maskTimer = setTimeout(function () { mask.style.display = 'none'; }, 25000);
  } else {
    clearTimeout(maskTimer);
    mask.style.display = 'none';   // 热着的 frame，直接可见
    applySection(key);
  }
  // 重复点当前视图会把 recent 顶出重复项，「留两个」就只剩一个不同的 frame
  recent = recent.filter(function (k) { return live[k] && k !== key; });
  recent.push(key);

  // keep current + previous warm, unmount the rest
  var keep = recent.slice(-2);
  recent.forEach(function (k) {
    if (keep.indexOf(k) === -1) { live[k].remove(); delete live[k]; }
  });
  recent = keep;

  if (push) {
    try { location.hash = key; } catch (e) { /* noop */ }
  }
  paintStrip();
  paintTitle();
  paintFoot();
  document.getElementById('btn-open').dataset.target = key;
}

/* 语言跟随站点（localStorage 同源共享，iframe 内也读同一份）。
   语言一变就整体重绘：外壳文案 + 每个 iframe 的标题。
   ⚠ 不往 iframe 里推 PVDB_i18n.apply() —— 子页（atlas / rvpsd）都是中文
     单语、不载 /i18n.js，推了也没有对应词条，只会白刷一遍 DOM。 */
function repaintForLang() {
  lastLang = lang();
  paintStrip();
  paintTitle();
  paintFoot();
  Object.keys(live).forEach(function (k) {
    live[k].title = VIEWS[k].t[lastLang === 'zh' ? 'zh' : 'en'];
  });
}
var lastLang = lang();
/* 轮询是兜底（语言可能被 iframe 内那颗按钮改掉）。 */
setInterval(function () { if (lang() !== lastLang) repaintForLang(); }, 400);

document.getElementById('btn-open').addEventListener('click', function () {
  var k = this.dataset.target || DEFAULT_KEY;
  /* 打开本视图对应的子页面，而不是外壳本身 */
  window.open(VIEWS[k].open, '_blank', 'noopener');
});

window.addEventListener('hashchange', function () {
  var p = parseHash();
  if (p.key !== current || p.sec) show(p.key, false, p.sec);
});

/* 入口：hash 决定视图（可带 /小节），没有就落默认视图（不写 hash，保持地址干净） */
(function boot() {
  var p = parseHash();
  show(p.key, false, p.sec);
})();
</script>
<script src="/lib/ai-assistant.js?v=2" data-context="structures" defer></script>
</body>
</html>
